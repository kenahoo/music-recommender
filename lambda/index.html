<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Advisor</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

#auth-overlay {
  position: fixed; inset: 0; background: #1a1a1a;
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
#auth-box { background: #2a2a2a; padding: 2rem; border-radius: 8px; width: 300px; }
#auth-box h2 { margin-bottom: 1rem; }
#auth-box input { width: 100%; padding: 0.5rem; background: #3a3a3a; border: 1px solid #555; color: #e0e0e0; border-radius: 4px; margin-bottom: 0.75rem; font-size: 1rem; }
#auth-box button { width: 100%; padding: 0.5rem; background: #4a90d9; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 1rem; }
#auth-error { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.5rem; display: none; }

#app { display: none; flex-direction: column; height: 100vh; }
header { padding: 1rem 1.5rem; background: #2a2a2a; border-bottom: 1px solid #3a3a3a; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
header h1 { font-size: 1.1rem; }

#messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 8px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.user { background: #2d4a6a; align-self: flex-end; }
.assistant { background: #2a2a2a; border: 1px solid #3a3a3a; align-self: flex-start; white-space: normal; }
.thinking { color: #888; font-style: italic; }
.assistant p { margin-bottom: 0.6em; }
.assistant p:last-child { margin-bottom: 0; }
.assistant ul, .assistant ol { margin: 0.4em 0 0.6em 1.4em; }
.assistant li { margin-bottom: 0.2em; }
.assistant h1, .assistant h2, .assistant h3 { margin: 0.6em 0 0.3em; }

#input-area { padding: 1rem 1.5rem; background: #2a2a2a; border-top: 1px solid #3a3a3a; display: flex; gap: 0.5rem; flex-shrink: 0; }
#input { flex: 1; padding: 0.6rem; background: #3a3a3a; border: 1px solid #555; color: #e0e0e0; border-radius: 4px; resize: none; font-family: inherit; font-size: 0.95rem; }
#send { padding: 0.6rem 1.2rem; background: #4a90d9; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
#send:disabled { opacity: 0.5; cursor: default; }

#pending-bar { display: none; background: #1e3a2f; border-top: 1px solid #2d6a4f; flex-shrink: 0; flex-direction: column; }
#pending-bar.show { display: flex; }
#pending-header { padding: 0.6rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
#pending-bar span { flex: 1; font-size: 0.9rem; color: #a8d8b9; }
#pending-bar button { padding: 0.4rem 0.9rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
#confirm-btn { background: #2d6a4f; color: white; }
#cancel-pending-btn { background: #444; color: #e0e0e0; }
#pending-diff { margin: 0 1.5rem 0.75rem; background: #111; border-radius: 4px; padding: 0.6rem 0.75rem; font-family: monospace; font-size: 0.8rem; overflow-x: auto; white-space: pre; max-height: 12rem; overflow-y: auto; }
#pending-diff .del { color: #ff6b6b; }
#pending-diff .add { color: #52b788; }
#pending-bar.committed { border-top-color: #52b788; }
#pending-bar.committed #pending-label { color: #7ee0a0; }
#pending-bar.committed #confirm-btn, #pending-bar.committed #cancel-pending-btn { display: none; }

#log-tab { position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 140; writing-mode: vertical-rl; background: #3a3a3a; color: #e0e0e0; border: 1px solid #555; border-left: none; border-radius: 0 6px 6px 0; padding: 0.9rem 0.35rem; cursor: pointer; font-size: 0.8rem; letter-spacing: 0.03em; user-select: none; }
#log-tab:hover { background: #454545; }
#log-resize { position: absolute; top: 0; right: 0; bottom: 0; width: 6px; cursor: ew-resize; }
#log-resize:hover { background: #4a90d9; }
#log-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#log-backdrop.open { opacity: 1; pointer-events: auto; }
#log-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 66vw; background: #1e1e1e; border-right: 1px solid #3a3a3a; z-index: 160; transform: translateX(-100%); transition: transform 0.2s ease; display: flex; flex-direction: column; }
#log-panel.open { transform: translateX(0); }
@media (max-width: 640px) { #log-panel { width: 90vw; } }
#log-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.25rem; border-bottom: 1px solid #3a3a3a; flex-shrink: 0; }
#log-panel-header span { font-size: 0.85rem; color: #aaa; font-family: monospace; }
#log-close { background: none; border: none; color: #aaa; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 0.25rem; }
#log-content { padding: 1.25rem 1.5rem; overflow-y: auto; line-height: 1.55; }
#log-content h1, #log-content h2, #log-content h3 { margin: 0.9em 0 0.4em; line-height: 1.25; }
#log-content h1 { font-size: 1.3rem; } #log-content h2 { font-size: 1.1rem; } #log-content h3 { font-size: 1rem; }
#log-content p { margin-bottom: 0.6em; }
#log-content ul, #log-content ol { margin: 0.4em 0 0.8em 1.4em; }
#log-content li { margin-bottom: 0.25em; }
#log-content a { color: #6ab0f3; }
#log-content code { background: #2a2a2a; padding: 0.1em 0.3em; border-radius: 3px; font-size: 0.9em; }
#log-content hr { border: none; border-top: 1px solid #3a3a3a; margin: 1em 0; }
#log-content table { border-collapse: collapse; width: 100%; margin: 0.6em 0; }
#log-content th, #log-content td { border: 1px solid #d9863f; padding: 0.35em 0.6em; text-align: left; vertical-align: top; }
#log-content th { background: rgba(217, 134, 63, 0.12); }
</style>
</head>
<body>

<div id="auth-overlay">
  <div id="auth-box">
    <h2>Music Advisor</h2>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
    <button id="auth-btn">Enter</button>
    <div id="auth-error">Incorrect password</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Music Advisor</h1>
    <div style="display:flex;gap:1rem;align-items:center;">
      <a id="logs-link" href="#" target="_blank" rel="noopener"
         style="color:#aaa;font-size:0.85rem;text-decoration:none;">Logs</a>
      <a href="https://github.com/kenahoo/music-recommender" target="_blank"
         style="color:#aaa;font-size:0.85rem;text-decoration:none;">GitHub</a>
    </div>
  </header>
  <div id="log-tab" title="Open listening log">Listening Log</div>
  <div id="log-backdrop"></div>
  <div id="log-panel">
    <div id="log-panel-header">
      <span>listening-log.md</span>
      <button id="log-close" title="Close">&times;</button>
    </div>
    <div id="log-content"></div>
    <div id="log-resize" title="Drag to resize"></div>
  </div>
  <div id="messages"></div>
  <div id="pending-bar">
    <div id="pending-header">
      <span id="pending-label"></span>
      <button id="cancel-pending-btn">Cancel</button>
      <button id="confirm-btn">Commit</button>
    </div>
    <div id="pending-diff"></div>
  </div>
  <div id="input-area">
    <textarea id="input" rows="2" placeholder="Ask about music... (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
let password = '';
let messages = [];
let pendingCommit = null;
let logGroupUrl = ''; // CloudWatch log group, provided by /api/auth

// Builds an error message with a link to the logs. Prefers a per-request log
// stream link (from the API), falling back to the whole log group.
function errorText(detail, logUrl) {
  const link = logUrl || logGroupUrl;
  return `(Error: ${detail})` + (link ? ` — [view logs](${link})` : '');
}

// Auth
document.getElementById('auth-btn').addEventListener('click', tryAuth);
document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryAuth();
});

async function tryAuth() {
  const pw = document.getElementById('password-input').value;
  const res = await fetch('/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (res.ok) {
    password = pw;
    sessionStorage.setItem('pw', pw);
    const data = await res.json().catch(() => ({}));
    logGroupUrl = data.logGroupUrl || '';
    const logsLink = document.getElementById('logs-link');
    if (logGroupUrl) logsLink.href = logGroupUrl;
    else logsLink.style.display = 'none';
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  } else {
    document.getElementById('auth-error').style.display = 'block';
  }
}

const stored = sessionStorage.getItem('pw');
if (stored) {
  document.getElementById('password-input').value = stored;
  tryAuth();
}

// Chat
document.getElementById('send').addEventListener('click', sendMessage);
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || document.getElementById('send').disabled) return;
  input.value = '';

  messages.push({ role: 'user', content: text });
  renderMessages();
  document.getElementById('send').disabled = true;

  const thinkingId = 'thinking-' + Date.now();
  const el = document.getElementById('messages');
  el.insertAdjacentHTML('beforeend',
    `<div class="message assistant thinking" id="${thinkingId}">...</div>`);
  el.scrollTop = el.scrollHeight;

  try {
    // Only send real conversation turns to the model. UI-only notices (errors,
    // "Commit cancelled.") are flagged `local` and excluded so they don't teach
    // the model to narrate actions it didn't take. Coalesce consecutive same-role
    // turns (e.g. two user messages after a filtered-out error) so roles alternate.
    const payload = [];
    for (const m of messages) {
      if (m.local) continue;
      const last = payload[payload.length - 1];
      if (last && last.role === m.role) last.content += '\n\n' + m.content;
      else payload.push({ role: m.role, content: m.content });
    }
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, messages: payload })
    });
    document.getElementById(thinkingId)?.remove();
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      messages.push({ role: 'assistant', content: data.content });
      setPending(data.pending || null);
    } else {
      messages.push({ role: 'assistant', content: errorText(data.error || `HTTP ${res.status}`, data.logUrl), local: true });
    }
    renderMessages();
  } catch (err) {
    document.getElementById(thinkingId)?.remove();
    messages.push({ role: 'assistant', content: errorText('Network error — please try again'), local: true });
    renderMessages();
  }
  document.getElementById('send').disabled = false;
  document.getElementById('input').focus();
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = messages.map(m =>
    `<div class="message ${m.role}">${m.role === 'assistant'
      ? marked.parse(m.content).replace(/<a /g, '<a target="_blank" rel="noopener" ')
      : escHtml(m.content)}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

function setPending(p) {
  pendingCommit = p;
  const bar = document.getElementById('pending-bar');
  bar.classList.remove('committed');
  if (p) {
    const confirmBtn = document.getElementById('confirm-btn');
    confirmBtn.disabled = false;
    confirmBtn.textContent = 'Commit';
    document.getElementById('pending-label').textContent = `Commit: "${p.commitMessage}"`;
    const diffEl = document.getElementById('pending-diff');
    diffEl.innerHTML = p.diff.split('\n').map(line => {
      if (line.startsWith('+')) return `<span class="add">${escHtml(line)}</span>`;
      if (line.startsWith('-')) return `<span class="del">${escHtml(line)}</span>`;
      return escHtml(line);
    }).join('\n');
    bar.classList.add('show');
  } else {
    bar.classList.remove('show');
    document.getElementById('pending-diff').innerHTML = '';
  }
}

document.getElementById('confirm-btn').addEventListener('click', async () => {
  if (!pendingCommit) return;
  const { newContent, commitMessage } = pendingCommit;
  const confirmBtn = document.getElementById('confirm-btn');
  confirmBtn.disabled = true;
  confirmBtn.textContent = 'Committing…';
  const res = await fetch('/api/commit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password, newContent, commitMessage })
  });
  const data = await res.json().catch(() => ({}));
  if (res.ok) {
    // Keep the diff visible and mark the bar committed instead of clearing it.
    pendingCommit = null;
    document.getElementById('pending-label').textContent = `✓ Committed: "${commitMessage}"`;
    document.getElementById('pending-bar').classList.add('committed');
  } else {
    // Leave the pending bar intact so the user can retry.
    confirmBtn.disabled = false;
    confirmBtn.textContent = 'Commit';
    messages.push({ role: 'assistant', content: errorText(`Commit failed: ${data.error || res.status}`, data.logUrl), local: true });
    renderMessages();
  }
});

document.getElementById('cancel-pending-btn').addEventListener('click', () => {
  setPending(null);
  messages.push({ role: 'assistant', content: 'Commit cancelled.', local: true });
  renderMessages();
});

// Listening-log drawer
const logPanel = document.getElementById('log-panel');
const logBackdrop = document.getElementById('log-backdrop');
const logContent = document.getElementById('log-content');

document.getElementById('log-tab').addEventListener('click', openLog);
document.getElementById('log-close').addEventListener('click', closeLog);
logBackdrop.addEventListener('click', closeLog);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && logPanel.classList.contains('open')) closeLog();
});

// Drag the right edge to resize the panel.
let logResizing = false;
document.getElementById('log-resize').addEventListener('mousedown', e => {
  logResizing = true;
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'ew-resize';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!logResizing) return;
  const w = Math.min(Math.max(e.clientX, 320), window.innerWidth * 0.95);
  logPanel.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  if (!logResizing) return;
  logResizing = false;
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
});

async function openLog() {
  logPanel.classList.add('open');
  logBackdrop.classList.add('open');
  logContent.innerHTML = '<p style="color:#888">Loading…</p>';
  try {
    const res = await fetch('/api/listening-log', { headers: { 'X-App-Password': password } });
    const data = await res.json().catch(() => ({}));
    logContent.innerHTML = res.ok
      ? marked.parse(data.content || '').replace(/<a /g, '<a target="_blank" rel="noopener" ')
      : `<p style="color:#ff6b6b">Couldn’t load the log (${data.error || res.status}).</p>`;
  } catch {
    logContent.innerHTML = '<p style="color:#ff6b6b">Network error loading the log.</p>';
  }
}
function closeLog() {
  logPanel.classList.remove('open');
  logBackdrop.classList.remove('open');
}

function escHtml(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
</script>
</body>
</html>
